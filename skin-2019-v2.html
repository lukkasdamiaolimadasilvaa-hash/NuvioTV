<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuvio - Skin Netflix 2019 (Addons Dynamic)</title>
<style>
:root{
  --accent:#e50914; --green:#46d369; --orange:#f5a623; --muted:#8c8c8c;
  --font:"Helvetica Neue",Helvetica,Arial,Roboto,Inter,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:#fff}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:#000;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- fundo / arte ---------- */
.bd{position:absolute;right:0;top:0;width:1360px;height:1080px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 42%);mask-image:linear-gradient(to right,transparent 0,#000 42%);
  transition:opacity .4s}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 0,rgba(0,0,0,.0) 45%)}

/* ---------- barra lateral (rail) ---------- */
#rail{position:absolute;left:38px;top:0;bottom:0;width:64px;z-index:20;display:none}
#rail.on{display:block}
#rail .ic{position:absolute;left:0;width:64px;height:64px;display:flex;align-items:center;justify-content:center;opacity:.75;transition:transform .2s,opacity .2s}
#rail svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rail .ic.act::after{content:"";position:absolute;bottom:6px;width:24px;height:4px;background:var(--accent)}
#rail .ic.f{opacity:1;transform:scale(1.3)}
#rail .ic.f svg{stroke-width:2.6}

/* ---------- HOME ---------- */
#home .info{position:absolute;left:155px;width:780px;transition:top .35s ease}
#home.hero .info{top:230px}
#home.rows .info{top:75px}
.title{font-weight:900;line-height:1.0;text-shadow:2px 2px 8px rgba(0,0,0,.75);transition:font-size .35s}
#home.hero .title{font-size:100px;letter-spacing:-1.5px}
#home.rows .title{font-size:66px}
.meta{display:flex;align-items:center;gap:14px;font-size:21px;margin:16px 0 8px}
.meta .g{color:var(--green);font-weight:700}
.meta .bx{background:#4d4d4d;padding:2px 10px;border-radius:3px;font-weight:700;font-size:18px}
.meta .ol{border:2px solid #aaa;padding:0 8px;border-radius:3px;font-size:16px;font-weight:700}
#home.hero .meta{opacity:0;height:0;margin:0;overflow:hidden}
.tag{font-size:24px;font-weight:700;margin:16px 0 8px}
.prog-hero{display:none;align-items:center;gap:14px;margin:14px 0}
#home.rows.is-cont .prog-hero{display:flex}
#home.rows.is-cont .meta, #home.rows.is-cont .syn, #home.rows.is-cont .ex-home{display:none}
.prog-hero .bar{width:340px;height:6px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.prog-hero .bar i{display:block;height:100%;background:var(--accent)}
.prog-hero span{font-size:20px;color:#ccc;font-weight:600}

.syn{font-size:25px;line-height:1.3;max-height:100px;overflow:hidden;text-shadow:1px 1px 4px #000;color:#efefef}
.ex-home{margin-top:18px;font-size:21px;color:#b3b3b3;line-height:1.45;display:none}
#home.rows .ex-home{display:block}
.ex-home .cast-row{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.ex-home .cast-row i{flex:0 0 42px;height:42px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.ex-home .cast-row svg{width:26px;height:26px;stroke:#000;fill:none;stroke-width:2.4}
.ex-home .genres-row{color:#fff;font-weight:600}

.btns{display:flex;gap:14px;margin-top:22px}
.b{font-size:23px;font-weight:700;padding:10px 36px;border-radius:4px;background:rgba(110,110,115,.65);color:#fff;transition:transform .15s;cursor:pointer}
.b.pl{background:#fff;color:#000}
.b.f{outline:4px solid #fff;outline-offset:3px;background:#fff;color:#000;transform:scale(1.05)}
#home.rows .btns{display:none}

#rowsWrap{position:absolute;left:0;right:0;transition:top .35s ease;z-index:2}
#home.hero #rowsWrap{top:750px}
.row{position:absolute;left:0;right:0;height:395px;transition:opacity .3s}
.row .rt{position:absolute;left:155px;top:0;font-size:26px;font-weight:700;color:#e5e5e5}
.trk{position:absolute;left:155px;top:44px;display:flex;gap:14px;transition:transform .28s ease}
.wm{position:absolute;right:54px;bottom:28px;font-weight:900;font-size:48px;color:var(--accent);letter-spacing:1.5px;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.8)}

/* ---------- POSTERS ---------- */
.p{position:relative;flex:0 0 auto;width:205px;height:300px;border-radius:3px;overflow:hidden;color:#fff;transition:transform .2s;background-size:cover;background-position:center;cursor:pointer}
.p .pt{position:absolute;left:12px;right:12px;bottom:34px;font-weight:900;font-size:24px;line-height:1.05;text-shadow:2px 2px 6px rgba(0,0,0,.85)}
.p .bdg{position:absolute;top:0;right:0;min-width:42px;padding:3px 8px 12px;background:var(--accent);font-style:normal;font-weight:700;font-size:19px;text-align:center;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.p .new{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--accent);font-size:14px;padding:2px 10px;font-weight:700;white-space:nowrap;border-radius:2px}
.p .pr{position:absolute;left:0;bottom:0;height:5px;background:var(--accent)}
.p.f{outline:5px solid #fff;outline-offset:-1px;z-index:5;transform:scale(1.03)}
.big .p{width:228px;height:316px}
.big .p .pt{font-size:27px}

/* ---------- DETALHE ---------- */
#detail .hdr{position:absolute;left:110px;top:65px;width:920px}
#detail .title{font-size:104px;letter-spacing:-1.5px}
#detail .meta{margin-top:18px;font-size:22px}
#detail .syn{font-size:28px;line-height:1.3;margin-top:14px;max-height:112px;width:860px}
#detail .ex{font-size:23px;color:#a6a6a6;line-height:1.5;margin-top:24px}
#detail .ex div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:860px}
#detail .dir{display:flex;gap:24px;align-items:center;margin-top:28px;font-size:26px;line-height:1.3;width:780px}
#detail .dir i{flex:0 0 66px;height:66px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
#detail .dir svg{width:40px;height:40px;stroke:#000;fill:none;stroke-width:2.4}

.menu{position:absolute;left:110px;top:525px}
.mi{display:flex;align-items:center;gap:22px;height:68px;width:540px;padding:0 22px;font-size:28px;font-weight:600;color:#b3b3b3;border:3px solid transparent;border-radius:2px;transition:all .15s;cursor:pointer}
.mi svg{width:26px;height:26px;stroke:#b3b3b3;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mi.f{border-color:#fff;color:#fff;background:rgba(255,255,255,.06);font-weight:700}
.mi.f svg{stroke:#fff}

.gridwrap{position:absolute;left:0;right:0;top:545px;bottom:0;overflow:hidden}
.glabel{position:absolute;left:110px;top:16px;font-size:26px;font-weight:700;color:#e5e5e5}
.grid{position:absolute;left:110px;top:56px;display:grid;grid-template-columns:repeat(7,228px);gap:16px 12px;transition:transform .3s ease}
.chev{position:absolute;left:42px;top:505px;width:48px;height:68px;z-index:3}
.chev svg{width:48px;height:68px;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#detail.mA .gridwrap,#detail.mA .chev,#detail.mA .dir{display:none}
#detail.mB .menu,#detail.mB .ex{display:none}

/* ---------- LISTA ---------- */
#list .bd{width:1500px}
#list .shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.94) 0,rgba(0,0,0,.58) 38%,rgba(0,0,0,0) 72%)}
#lst{position:absolute;left:165px;top:0;width:900px;transition:transform .3s ease}
.li{height:90px;line-height:90px;font-size:50px;font-weight:500;color:var(--muted);position:relative;white-space:nowrap}
.li.f{color:#fff;font-weight:800}
.li.f::before{content:"";position:absolute;left:-30px;top:10px;width:7px;height:70px;background:var(--orange)}

/* ---------- player + toast ---------- */
#player{position:absolute;inset:0;background:#000;z-index:50;display:none}
#player.on{display:block}
#player .pn{position:absolute;left:120px;top:90px;font-size:44px;font-weight:700}
#player .bar{position:absolute;left:120px;right:120px;bottom:130px;height:8px;background:#555}
#player .bar i{display:block;height:100%;width:6%;background:var(--accent);animation:pg 30s linear forwards}
@keyframes pg{to{width:100%}}
#player .hint{position:absolute;left:120px;bottom:70px;color:#aaa;font-size:24px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(25,25,25,.96);border:2px solid #777;padding:16px 34px;font-size:25px;z-index:60;display:none;border-radius:4px}
</style>
</head>
<body>
<div id="stage">
  <div id="rail"></div>

  <div id="home" class="screen hero">
    <div class="bd" id="hBd"></div>
    <div class="info">
      <div class="title" id="hTitle"></div>
      <div class="meta" id="hMeta"></div>
      <div class="tag" id="hTag"></div>
      <div class="prog-hero" id="hProg"><div class="bar"><i id="hProgBar"></i></div><span id="hProgTxt"></span></div>
      <div class="syn" id="hSyn"></div>
      <div class="ex-home" id="hExHome"></div>
      <div class="btns"><div class="b pl" id="bPlay">▶&nbsp; Assistir</div><div class="b" id="bMore">Mais Info</div></div>
    </div>
    <div id="rowsWrap"></div>
    <div class="wm">NUVIO</div>
  </div>

  <div id="detail" class="screen mA">
    <div class="bd" id="dBd"></div>
    <div class="hdr">
      <div class="title" id="dTitle"></div>
      <div class="meta" id="dMeta"></div>
      <div class="syn" id="dSyn"></div>
      <div class="ex" id="dEx"></div>
      <div class="dir" id="dDir"></div>
    </div>
    <div class="menu" id="dMenu"></div>
    <div class="chev"><svg viewBox="0 0 30 50"><polyline points="24,4 6,25 24,46"/></svg></div>
    <div class="gridwrap big"><div class="glabel" id="dLabel"></div><div class="grid" id="dGrid"></div></div>
  </div>

  <div id="list" class="screen">
    <div class="bd" id="lBd"></div>
    <div class="shade"></div>
    <div id="lst"></div>
  </div>

  <div id="player"><div class="pn" id="pName"></div><div class="bar"><i></i></div><div class="hint">Nuvio Player · Pressione Voltar (Esc / Backspace) para sair</div></div>
  <div id="toast"></div>
</div>

<script>
/* =========================================================================
   INTEGRAÇÃO NUVIO / ADDONS + PRÉ-VISUALIZAÇÃO AUTOMÁTICA:
   Quando aberto no Nuvio, carrega os catálogos reais dos seus addons.
   Quando aberto direto no navegador do notebook, exibe uma amostra visual
   para você testar a navegação (setas do teclado + Enter) sem ficar tela preta.
========================================================================= */
const fallbackSample = [
  {
    id: "addon_1",
    title: "St. Denis Medical",
    type: "series",
    year: 2024,
    rating: "TV-14",
    seasons: 1,
    dur: "22m",
    q: "4K HDR",
    match: 92,
    genres: ["Comédia", "Drama"],
    hue: 350,
    badge: 10,
    isNew: true,
    prog: 35,
    poster: "",
    backdrop: "",
    syn: "Em um hospital com poucos recursos e equipe reduzida, médicos e enfermeiros tentam tratar os pacientes enquanto mantêm a própria sanidade.",
    cast: "Wendi McLendon-Covey, David Alan Grier, Allison Tolman",
    by: "Justin Spitzer / Eric Ledgin"
  },
  {
    id: "addon_2",
    title: "Horizonte Sombrio",
    type: "movie",
    year: 2025,
    rating: "16",
    dur: "2h 14m",
    q: "4K HDR",
    match: 96,
    genres: ["Ficção Científica", "Suspense"],
    hue: 210,
    badge: 85,
    isNew: false,
    prog: 60,
    poster: "",
    backdrop: "",
    syn: "Uma expedição espacial descobre um sinal misterioso vindo da borda do sistema solar, revelando segredos ocultos.",
    cast: "Ana Lima, Bruno Costa, Carla Dias",
    by: "Addon Provider TMDB"
  },
  {
    id: "addon_3",
    title: "Código Aurora",
    type: "series",
    year: 2026,
    rating: "TV-MA",
    seasons: 2,
    dur: "48m",
    q: "FHD",
    match: 89,
    genres: ["Ação", "Crime"],
    hue: 15,
    badge: 42,
    isNew: true,
    prog: 15,
    poster: "",
    backdrop: "",
    syn: "Um especialista em cibersegurança precisa infiltrar uma rede clandestina antes que o sistema financeiro entre em colapso.",
    cast: "Diego Rocha, Elisa Prado, Fábio Nunes",
    by: "Addon Cinemeta"
  },
  {
    id: "addon_4",
    title: "Vale dos Ecos",
    type: "movie",
    year: 2023,
    rating: "PG-13",
    dur: "1h 52m",
    q: "4K HDR",
    match: 84,
    genres: ["Drama", "Mistério"],
    hue: 145,
    badge: 71,
    isNew: false,
    prog: 0,
    poster: "",
    backdrop: "",
    syn: "Segredos de família vêm à tona quando dois irmãos retornam à antiga propriedade no interior.",
    cast: "Gabi Torres, Hugo Matos",
    by: "Addon Catalog"
  }
];

let catalog = (window.nuvioCatalogs && window.nuvioCatalogs.length) ? window.nuvioCatalogs : fallbackSample;

const artGrad = it => `radial-gradient(circle at 65% 38%,hsl(${it.hue||0},75%,45%) 0,transparent 46%),radial-gradient(circle at 88% 72%,hsl(${(it.hue||0)+60},70%,35%) 0,transparent 42%),linear-gradient(135deg,hsl(${it.hue||0},45%,18%),#050505)`;
const posterGrad = it => `radial-gradient(circle at 70% 25%,hsl(${it.hue||350},80%,50%) 0,transparent 55%),linear-gradient(160deg,hsl(${(it.hue||350)+25},60%,32%),hsl(${(it.hue||350)+50},60%,10%))`;

const T={
  play:"▶  Assistir",
  more:"Mais Info",
  watchNow:"Assistir Temporada 1 Agora",
  watchMovie:"Assistir Agora",
  playS:"Assistir Temporada 1: Episódio 1",
  playM:"Assistir",
  eps:"Mais Episódios",
  trailer:"Assistir Trailer",
  trailers:"Trailers e Mais",
  add:"Adicionar à Minha Lista",
  rem:"Remover da Minha Lista",
  season:"Temporada",
  seasons:"Temporadas",
  match:"Relevante",
  cast:"Elenco:",
  creators:"Criação:",
  director:"Direção",
  withRoles:"com",
  inRoles:"",
  newEp:"Novos Episódios",
  remPct:"% restante",
  sections:["Pesquisar","Início","Bombando","Séries","Filmes","Minha Lista","Gêneros"]
};

const IC={
  search:'<circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="21" y2="21"/>',
  home:'<path d="M3 11 12 3l9 8v10h-6v-7H9v7H3z"/>',
  trend:'<polyline points="2,18 9,11 13,15 22,6"/><polyline points="16,6 22,6 22,12"/>',
  tv:'<rect x="3" y="4" width="18" height="12"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
  film:'<rect x="3" y="7" width="18" height="13"/><path d="M3 7l3-4 4 4M10 7l3-4 4 4"/>',
  user:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="18" cy="9" r="2.5"/>',
  plus:'<line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/>',
  check:'<polyline points="4,12 9,17 20,6"/>',
  play:'<polygon points="5,3 20,12 5,21" fill="currentColor"/>',
  eps:'<rect x="3" y="6" width="15" height="12"/><path d="M6 3h15v12"/>',
  clap:'<rect x="3" y="9" width="18" height="12"/><path d="M3 9l2-5 16 2-1 3"/>'
};
const svg=(k,x="")=>`<svg viewBox="0 0 24 24" ${x}>${IC[k]}</svg>`;

const $=s=>document.querySelector(s);
const S={screen:"home",section:1,zone:"btn",rail:false,row:0,col:[],rows:[],list:[],hist:[],detail:null,L:null,D:null,btn:0};
const RAIL=["search","home","trend","tv","film","user","plus"];

function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("#stage");
  st.style.transform=`scale(${s})`;
  st.style.left=(innerWidth-1920*s)/2+"px";
  st.style.top=(innerHeight-1080*s)/2+"px";
}
addEventListener("resize",fit);fit();

function toast(t){
  const e=$("#toast");e.textContent=t;e.style.display="block";
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2000);
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));S.screen=id}

function buildRail(){
  const r=$("#rail");
  r.innerHTML=RAIL.map((k,i)=>`<div class="ic" data-i="${i}" style="top:${260+i*88}px">${svg(k)}</div>`).join("");
}
function paintRail(){
  document.querySelectorAll("#rail .ic").forEach((e,i)=>{
    e.classList.toggle("act",i===S.section);
    e.classList.toggle("f",S.rail&&i===S.railIdx);
  });
}
buildRail();

/* Sincronização automática com os Addons do Nuvio */
function loadAddonData(){
  if(window.NuvioAPI && typeof window.NuvioAPI.getCatalog === "function"){
    window.NuvioAPI.getCatalog().then(data => {
      if(data && data.length) { catalog = data; enterHome(S.section, false); }
    });
  }
}

function rowsFor(sec){
  const all=catalog, sh=all.filter(x=>x.type==="series"), mv=all.filter(x=>x.type==="movie");
  const rot=(a,n)=>a.slice(n).concat(a.slice(0,n));
  if(sec===5)return [{t:"Minha Lista (Addons)",items:(S.mylist||[]).map(id=>all.find(x=>x.id===id)).filter(Boolean)}].filter(r=>r.items.length).concat(S.mylist&&S.mylist.length?[]:[{t:"Sua lista está vazia",items:rot(all,1)}]);
  if(sec===2)return [{t:"Bombando nos Addons",items:rot(all,1)},{t:"Populares da Semana",items:rot(all,2)}];
  if(sec===3)return [{t:"Continuar Assistindo (Séries)",items:sh.length?sh:all,prog:1}];
  if(sec===4)return [{t:"Filmes em Alta",items:mv.length?mv:all}];
  return [
    {t:"Continuar Assistindo",items:all,prog:1},
    {t:"Recomendado pelos Addons",items:rot(all,1)},
    {t:"Séries em Destaque",items:sh.length?sh:all},
    {t:"Filmes Populares",items:mv.length?mv:all}
  ];
}

function enterHome(sec,keep){
  S.section=sec;show("home");$("#rail").classList.add("on");
  if(!keep){S.rows=rowsFor(sec);S.col=S.rows.map(()=>0);S.row=0;S.zone="btn";S.rail=false}
  $("#rowsWrap").innerHTML=S.rows.map((r,ri)=>`<div class="row" style="top:${ri*395}px"><div class="rt">${r.t}</div><div class="trk">`+
    r.items.map(it=>`<div class="p" style="${it.poster?`background-image:url(${it.poster})`:`background:${posterGrad(it)}`}" ><span class="pt">${it.title}</span><i class="bdg">${it.badge||'HD'}</i>${it.isNew?`<b class="new">${T.newEp}</b>`:""}${r.prog&&it.prog?`<span class="pr" style="width:${it.prog}%"></span>`:""}</div>`).join("")+`</div></div>`).join("");
  paintHome();
}

function homeItem(){const r=S.rows[S.zone==="btn"?0:S.row];return r && r.items ? r.items[S.col[S.zone==="btn"?0:S.row]] : catalog[0]}
function metaHtml(it){
  return `<span class="g">${it.match?it.match+'% '+T.match:''}</span><span>${it.year||''}</span><span class="bx">${it.rating||'PG'}</span><span>${it.type==="series"?(it.seasons||1)+" "+(it.seasons>1?T.seasons:T.season):(it.dur||'')}</span><span class="ol">${it.q||'FHD'}</span>`;
}

function paintHome(){
  const h=$("#home"),curRow=S.rows[S.row],it=homeItem();
  if(!it)return;
  const isCont=(S.zone==="row"&&curRow&&curRow.prog);
  h.className="screen on "+(S.zone==="btn"?"hero":"rows")+(isCont?" is-cont":"");
  
  if(it.backdrop) $("#hBd").style.background=`url(${it.backdrop}) center/cover`;
  else $("#hBd").style.background=artGrad(it);

  $("#hTitle").textContent=it.title;
  $("#hMeta").innerHTML=metaHtml(it);
  $("#hTag").textContent=isCont?(it.type==="series"?"Temporada 1: Episódio 1":it.title):(it.type==="series"?T.watchNow:T.watchMovie);
  $("#hProgBar").style.width=(it.prog||0)+"%";
  $("#hProgTxt").textContent=(100-(it.prog||0))+T.remPct;
  $("#hSyn").textContent=it.syn || "Descrição carregada via Addons do Nuvio.";
  $("#hExHome").innerHTML=`<div class="cast-row"><i>${svg("clap")}</i><span>${it.cast || 'Elenco dos Addons'}</span></div><div class="genres-row">${(it.genres||[]).join(" / ")}</div>`;
  
  $("#bPlay").classList.toggle("f",!S.rail&&S.zone==="btn"&&S.btn!==1);
  $("#bMore").classList.toggle("f",!S.rail&&S.zone==="btn"&&S.btn===1);
  if(S.zone==="row")$("#rowsWrap").style.top=(545-S.row*395)+"px";else $("#rowsWrap").style.top="";
  
  document.querySelectorAll("#rowsWrap .row").forEach((rw,ri)=>{
    rw.style.opacity=(S.zone==="row"&&ri<S.row)?0:1;
    rw.querySelectorAll(".p").forEach((p,ci)=>p.classList.toggle("f",!S.rail&&S.zone==="row"&&ri===S.row&&ci===S.col[ri]));
    const c=S.col[ri];
    const trk = rw.querySelector(".trk");
    if(trk) trk.style.transform=`translateX(${-Math.max(0,c-5)*219}px)`;
  });
  paintRail();
}

function sim(it){return catalog.filter(x=>x.id!==it.id)}
function enterDetail(it,mode,grid,label){
  show("detail");$("#rail").classList.remove("on");
  S.D={it,mode,menu:0,gi:0,grid:grid||[it].concat(sim(it)),label:label||T.trailers};
  if(grid){const k=grid.findIndex(x=>x.id===it.id);S.D.gi=k<0?0:k}
  paintDetail(true);
}

function menuItems(it){
  const inList=(S.mylist||[]).includes(it.id);
  const a=[
    {k:"play",t:it.type==="series"?T.playS:T.playM},
    {k:"eps",t:T.eps,only:"series"},
    {k:"trailer",t:T.trailer,i:"play"},
    {k:"trailers",t:T.trailers,i:"clap"},
    {k:"plus",t:inList?T.rem:T.add,i:inList?"check":"plus",add:1}
  ];
  return a.filter(x=>!x.only||x.only===it.type);
}

function paintDetail(build){
  const D=S.D,d=$("#detail"),it=D.mode==="B"?D.grid[D.gi]:D.it;
  if(!it)return;
  d.className="screen on m"+D.mode;
  if(it.backdrop) $("#dBd").style.background=`url(${it.backdrop}) center/cover`;
  else $("#dBd").style.background=artGrad(it);

  $("#dTitle").textContent=it.title;
  $("#dTitle").style.fontSize=D.mode==="A"?"104px":"92px";
  $("#dMeta").innerHTML=metaHtml(it);
  $("#dSyn").textContent=it.syn || "";
  $("#dEx").innerHTML=`<div>${T.cast} ${it.cast || 'N/A'}</div><div>${T.creators} ${it.by || 'N/A'}</div><div>${(it.genres||[]).join(" / ")}</div>`;
  $("#dDir").innerHTML=`<i>${svg("clap")}</i><span>Fontes e Streams carregados via Addons do Nuvio</span>`;
  
  const mi=menuItems(D.it);
  $("#dMenu").innerHTML=mi.map((m,i)=>`<div class="mi ${i===D.menu?"f":""}">${svg(m.i||m.k)}<span>${m.t}</span></div>`).join("");
  if(build||D.mode==="B"){
    $("#dLabel").textContent=D.label;
    if(build)$("#dGrid").innerHTML=D.grid.map(x=>`<div class="p" style="${x.poster?`background-image:url(${x.poster})`:`background:${posterGrad(x)}`}"><span class="pt">${x.title}</span><i class="bdg">${x.badge||'HD'}</i></div>`).join("");
    document.querySelectorAll("#dGrid .p").forEach((p,i)=>p.classList.toggle("f",D.mode==="B"&&i===D.gi));
    $("#dGrid").style.transform=`translateY(${-Math.floor(D.gi/7)*332}px)`;
  }
}

function enterList(kind,type){
  show("list");$("#rail").classList.add("on");S.section=kind==="types"?0:6;
  const items=kind==="types"?["Filmes","Séries","Streams dos Addons"]:["Ação", "Drama", "Comédia", "Ficção"];
  S.L={kind,type,items,idx:0};paintList();
}

function listItem(){
  return catalog[S.L.idx % catalog.length];
}

function paintList(){
  const L=S.L;
  const it = listItem();
  if(it && it.backdrop) $("#lBd").style.background=`url(${it.backdrop}) center/cover`;
  else if(it) $("#lBd").style.background=artGrad(it);
  $("#lst").innerHTML=L.items.map((g,i)=>`<div class="li ${!S.rail&&i===L.idx?"f":""}">${g}</div>`).join("");
  paintRail();
}

function push(){S.hist.push(S.screen==="detail"?{s:"detail",D:S.D}:S.screen==="list"?{s:"list",L:S.L}:{s:"home"})}
function back(){
  if($("#player").classList.contains("on")){$("#player").classList.remove("on");return}
  const h=S.hist.pop();
  if(!h){if(S.screen!=="home")enterHome(1);return}
  if(h.s==="home"){enterHome(S.section||1,true)}
  else if(h.s==="detail"){S.D=h.D;show("detail");paintDetail(true)}
  else if(h.s==="list"){S.L=h.L;show("list");$("#rail").classList.add("on");paintList()}
}

function goSection(i){
  S.hist=[];
  if(i===0)enterList("types");else if(i===6)enterList("genres");else enterHome(i);
}

function play(it){
  $("#pName").textContent="Reproduzindo: " + it.title + " (Streams via Addons)";
  $("#player").classList.add("on");
}

const KEYMAP={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",Enter:"ok",Escape:"bk",Backspace:"bk",
  10009:"bk",461:"bk",27:"bk",8:"bk",13:"ok",37:"l",38:"u",39:"r",40:"d"};

document.addEventListener("keydown",e=>{
  const k=KEYMAP[e.key]||KEYMAP[e.keyCode];if(!k)return;e.preventDefault();
  if($("#player").classList.contains("on")){if(k==="bk")back();return}
  if(k==="bk"){back();return}
  if(S.rail&&S.screen!=="detail"){
    if(S.railIdx===undefined)S.railIdx=S.section;
    if(k==="u")S.railIdx=Math.max(0,S.railIdx-1);
    if(k==="d")S.railIdx=Math.min(6,S.railIdx+1);
    if(k==="r")S.rail=false;
    if(k==="ok"){S.rail=false;goSection(S.railIdx);return}
    S.screen==="home"?paintHome():paintList();return;
  }
  if(S.screen==="home")keyHome(k);else if(S.screen==="detail")keyDetail(k);else if(S.screen==="list")keyList(k);
});

function toRail(){S.rail=true;S.railIdx=S.section}

function keyHome(k){
  const nr=S.rows.length;
  if(S.zone==="btn"){
    if(k==="r")S.btn=1;
    else if(k==="l"){if(S.btn===1)S.btn=0;else toRail()}
    else if(k==="d"){S.zone="row";S.row=0}
    else if(k==="ok"){
      const it=homeItem();
      if(S.btn===0)play(it);
      else{push();enterDetail(it,"A",null);return}
    }
  }else{
    const r=S.row,n=S.rows[r].items.length;
    if(k==="r")S.col[r]=Math.min(n-1,S.col[r]+1);
    else if(k==="l"){if(S.col[r]>0)S.col[r]--;else toRail()}
    else if(k==="d"){if(r<nr-1){S.row++;S.col[S.row]=Math.min(S.col[S.row],S.rows[S.row].items.length-1)}}
    else if(k==="u"){if(r>0)S.row--;else{S.zone="btn";S.btn=0}}
    else if(k==="ok"){
      const it=homeItem();
      push();
      enterDetail(it,"A",null);
      return;
    }
  }
  paintHome();
}

function keyDetail(k){
  const D=S.D;
  if(D.mode==="A"){
    const mi=menuItems(D.it);
    if(k==="u")D.menu=Math.max(0,D.menu-1);
    else if(k==="d")D.menu=Math.min(mi.length-1,D.menu+1);
    else if(k==="l")back();
    else if(k==="ok"){
      const m=mi[D.menu];
      if(m.k==="play")play(D.it);
      else if(m.k==="eps")toast("Buscando episódios via Addons...");
      else if(m.k==="trailer")toast("Buscando trailers...");
      else if(m.k==="trailers"){
        push();
        enterDetail(D.it,"B",[D.it].concat(sim(D.it)),T.trailers);
        return;
      }
      else if(m.add){
        S.mylist=S.mylist||[];
        const i=S.mylist.indexOf(D.it.id);
        i<0?S.mylist.push(D.it.id):S.mylist.splice(i,1);
        toast(i<0?"Adicionado à Minha Lista":"Removido da Minha Lista");
      }
    }
  }else{
    const n=D.grid.length;
    if(k==="r")D.gi=Math.min(n-1,D.gi+1);
    else if(k==="l"){if(D.gi%7===0)back();else D.gi--}
    else if(k==="d")D.gi=Math.min(n-1,D.gi+7);
    else if(k==="u")D.gi=Math.max(0,D.gi-7);
    else if(k==="ok"){push();enterDetail(D.grid[D.gi],"A",null);return}
  }
  paintDetail(false);
}

function keyList(k){
  const L=S.L;
  if(k==="u")L.idx=Math.max(0,L.idx-1);
  else if(k==="d")L.idx=Math.min(L.items.length-1,L.idx+1);
  else if(k==="l")toRail();
  else if(k==="ok"){
    toast("Filtrando conteúdo dos addons...");
    return;
  }
  paintList();
}

loadAddonData();
enterHome(1);
</script>
</body>
